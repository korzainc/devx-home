# pnpm 11 blocks dependency build scripts unless approved here, and an unapproved one is a hard
# error on every command, not a warning - pnpm re-checks dependency status before each script, so
# every script fails until this list is right. `pnpm approve-builds` writes this interactively,
# which is no use in CI, so it is committed instead.
#
# unrs-resolver is the native resolver behind eslint-import-resolver-typescript, pulled in by
# eslint-config-next. Without its build step `pnpm lint` cannot resolve imports.
allowBuilds:
  unrs-resolver: true

# Patch ESLint's YAML parser for CVE-2026-84375 without moving it to js-yaml v5.
# Remove when this parent version is replaced by one resolving a patched parser.
overrides:
  "@eslint/eslintrc@3.3.6>js-yaml": 4.3.2

  # Seven HIGH advisories Trivy gates on, all with released fixes, all transitive and pinned by
  # parents we do not control -- `pnpm update` cannot reach them, so they are forced here.
  #
  # brace-expansion (CVE-2026-102276, CVE-2026-102278, denial of service): arrives via
  # minimatch under the eslint chain, dev-only. Two majors are installed and each needs its
  # own floor.
  #
  # undici (CVE-2026-19534 denial of service, CVE-2026-84961 TLS certificate validation
  # bypass, CVE-2026-85152 authentication bypass via cross-origin cache): arrives via
  # jsdom under vitest. `pnpm why --prod` puts it in the production tree through better-auth,
  # but better-auth declares neither vitest nor jsdom, so the edge is a dev one pnpm's --prod
  # filter does not drop. Treated as reachable anyway -- the two bypasses are the wrong pair
  # to be wrong about, and the floor costs nothing.
  #
  # Remove each when the parent resolves a fixed version on its own.
  "brace-expansion@1": "^1.1.20"
  "brace-expansion@5": "^5.0.11"
  "undici": "^8.10.2"
