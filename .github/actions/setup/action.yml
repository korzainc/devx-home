name: "Setup pnpm and Node"
description: "Installs pnpm, the Node version from .nvmrc (or the given override), and project dependencies."

inputs:
  node-version:
    description: "Overrides .nvmrc, e.g. for a CI matrix leg."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No version input: action-setup reads the pinned `packageManager` field from package.json,
    # so the pnpm version can never drift between here and a developer's machine.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    # Must come after pnpm is on PATH - `cache: pnpm` resolves the store path by running pnpm.
    # setup-node warns if both node-version and node-version-file are set, so only one is ever
    # passed: the override when given, .nvmrc otherwise.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
