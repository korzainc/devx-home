name: "Setup pnpm and Node"
description: "Installs pnpm, the Node version from .nvmrc, and project dependencies."

runs:
  using: composite
  steps:
    # No version input: action-setup reads the pinned `packageManager` field from package.json,
    # so the pnpm version can never drift between here and a developer's machine.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    # Must come after pnpm is on PATH - `cache: pnpm` resolves the store path by running pnpm.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
