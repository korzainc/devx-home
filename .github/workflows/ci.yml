name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. No job here writes to the repo, comments on a PR, or uploads SARIF to
# code scanning, so nothing needs more. Widen per-job if that ever changes, never here.
permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Runs `next typegen` first - see the script. Plain tsc fails on a clean checkout.
      - run: pnpm typecheck

  # Proves the migrations apply to an empty database and that a second run is a no-op. Production
  # is migrated by the Vercel build command, not from here - see the vercel-build script - because
  # only that ordering guarantees the schema moves before the code that needs it. This job is the
  # gate in front of that: broken SQL fails a pull request instead of a deploy.
  #
  # Runs against a throwaway container, so it needs no secret and never reaches Neon. Nothing here
  # can be checked against the real schema, which is the known limit of a fresh-apply test.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # sslmode is stated rather than left out. The service container serves no TLS, and the
      # script only forces verify-full on the modes Neon produces - see verifyingTls.
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/migrations_check?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Apply to an empty database
        run: pnpm migrate

      # The ledger is the thing being tested here, not the SQL. A migration that reapplies itself
      # on every deploy is the failure this catches, and it is silent until production.
      - name: Re-run must change nothing
        run: |
          set -euo pipefail
          output=$(pnpm migrate)
          echo "$output"
          if ! grep -q "nothing to apply" <<<"$output"; then
            echo "::error::A second run was not a no-op. Migrations must be recorded, not repeated."
            exit 1
          fi

      - name: Telemetry PostgreSQL and HTTP regressions
        env:
          # The suite uses a unique schema in this disposable service and removes it afterward.
          TEST_TELEMETRY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/migrations_check?sslmode=disable
        run: pnpm exec vitest run src/lib/telemetry-postgres.test.ts src/lib/telemetry-consent-postgres.test.ts

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
