name: Korza CI Base Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write # the sticky PR comment
  id-token: write # authenticates the registry pull via azure/login's OIDC token request

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci-common # see docs/onboarding.md in korzainc/shared-workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sca/sast need real history to diff against on a pr run

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.CI_COMMON_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CI_COMMON_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CI_COMMON_AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name korzacitools

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-scratch/trivy-db
          key: trivy-db-${{ github.run_id }} # unique per run, so a save always happens
          restore-keys: trivy-db- # prefix match still restores the last run's DB

      # Dogfooding on purpose: Kingfisher/Trivy in ci.yml already cover secrets/sca, but this
      # runs the full bundle anyway so it's proven working end to end here before either of
      # those gets removed in a follow-up. No Dockerfile in this repo, so image-scan is left
      # out entirely - ci-run scan already excludes it for exactly that case.
      - name: ci-run scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-out" "$RUNNER_TEMP/ci-scratch"
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$RUNNER_TEMP/ci-out:/out" \
            -v "$RUNNER_TEMP/ci-scratch:/scratch" \
            -e CI=true -e CI_SCRATCH_DIR=/scratch \
            -e TRIVY_CACHE_DIR=/scratch/trivy-db \
            -e CI_SCA_BLOCKING=false -e CI_IAC_CONFIG_BLOCKING=false -e CI_IAC_DOCKERFILE_BLOCKING=false \
            -e GITHUB_STEP_SUMMARY=/step-summary \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" \
            korzacitools.azurecr.io/ci-common:0.3.0@sha256:aeb58c4af0405f1d564e608c0995c93d96a1f6cfb6513335922762ee5c0b97f9 \
            ci-run scan --out /out --repo-root "$PWD" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      # No --expect-image-labels: that flag expects a real image-scan leaf to have run, and
      # this repo never runs one (no Dockerfile). Passing it anyway would be harmless on a pr
      # run but fail every main-push run waiting on a scan that can never exist.
      - name: ci-run report
        if: always() # still post annotations/the combined verdict even if a check above failed
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/ci-out:/out" \
            -v "$GITHUB_EVENT_PATH:/event.json:ro" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_ACTIONS=true -e GITHUB_EVENT_NAME \
            -e GITHUB_EVENT_PATH=/event.json -e GITHUB_REPOSITORY \
            -e GITHUB_SHA -e GITHUB_API_URL -e GITHUB_SERVER_URL -e GITHUB_RUN_ID \
            -e GITHUB_STEP_SUMMARY=/step-summary \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" \
            korzacitools.azurecr.io/ci-common:0.3.0@sha256:aeb58c4af0405f1d564e608c0995c93d96a1f6cfb6513335922762ee5c0b97f9 \
            ci-run report --in /out --event-file /event.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            ${{ runner.temp }}/ci-scratch/ci-common/sca.sbom.cdx.json
            ${{ runner.temp }}/ci-scratch/ci-common/sca.sbom.spdx.json
          if-no-files-found: warn
