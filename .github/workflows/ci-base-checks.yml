name: Korza CI Base Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci-common # see docs/onboarding.md in korzainc/shared-workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.CI_COMMON_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CI_COMMON_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CI_COMMON_AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name korzacitools

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-scratch/trivy-db
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # secrets (Kingfisher) and sca (Trivy) already run as their own jobs in ci.yml - only
      # wiring the leaves those don't cover, not the full bundle. No Dockerfile in this repo,
      # so image-scan doesn't apply either.
      - name: ci-run sast
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-out" "$RUNNER_TEMP/ci-scratch"
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$RUNNER_TEMP/ci-out:/out" \
            -v "$RUNNER_TEMP/ci-scratch:/scratch" \
            -e CI=true -e CI_SCRATCH_DIR=/scratch \
            -e GITHUB_STEP_SUMMARY=/step-summary \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" \
            korzacitools.azurecr.io/ci-common:0.3.0@sha256:aeb58c4af0405f1d564e608c0995c93d96a1f6cfb6513335922762ee5c0b97f9 \
            ci-run sast --out /out --repo-root "$PWD" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: ci-run iac-config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$RUNNER_TEMP/ci-out:/out" \
            -v "$RUNNER_TEMP/ci-scratch:/scratch" \
            -e CI=true -e CI_SCRATCH_DIR=/scratch \
            -e TRIVY_CACHE_DIR=/scratch/trivy-db \
            -e CI_IAC_CONFIG_BLOCKING=false \
            -e GITHUB_STEP_SUMMARY=/step-summary \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" \
            korzacitools.azurecr.io/ci-common:0.3.0@sha256:aeb58c4af0405f1d564e608c0995c93d96a1f6cfb6513335922762ee5c0b97f9 \
            ci-run iac-config --out /out --repo-root "$PWD" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: ci-run iac-dockerfile-lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$RUNNER_TEMP/ci-out:/out" \
            -v "$RUNNER_TEMP/ci-scratch:/scratch" \
            -e CI=true -e CI_SCRATCH_DIR=/scratch \
            -e CI_IAC_DOCKERFILE_BLOCKING=false \
            -e GITHUB_STEP_SUMMARY=/step-summary \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" \
            korzacitools.azurecr.io/ci-common:0.3.0@sha256:aeb58c4af0405f1d564e608c0995c93d96a1f6cfb6513335922762ee5c0b97f9 \
            ci-run iac-dockerfile-lint --out /out --repo-root "$PWD" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: ci-run report
        if: always()
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/ci-out:/out" \
            -v "$GITHUB_EVENT_PATH:/event.json:ro" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_ACTIONS=true -e GITHUB_EVENT_NAME \
            -e GITHUB_EVENT_PATH=/event.json -e GITHUB_REPOSITORY \
            -e GITHUB_SHA -e GITHUB_API_URL -e GITHUB_SERVER_URL -e GITHUB_RUN_ID \
            -e GITHUB_STEP_SUMMARY=/step-summary \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" \
            korzacitools.azurecr.io/ci-common:0.3.0@sha256:aeb58c4af0405f1d564e608c0995c93d96a1f6cfb6513335922762ee5c0b97f9 \
            ci-run report --in /out --event-file /event.json
