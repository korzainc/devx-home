name: Korza CI Base Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci-common # see docs/onboarding.md in korzainc/shared-workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.CI_COMMON_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CI_COMMON_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CI_COMMON_AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name korzacitools

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-scratch/trivy-db
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # secrets (Kingfisher) and sca (Trivy) already run as their own jobs in ci.yml - only
      # wiring the leaves those don't cover, not the full bundle. No Dockerfile in this repo,
      # so image-scan doesn't apply either.
      #
      # A standalone `ci-run <capability>` call takes only --repo-root/--base-sha/--head-sha -
      # no --out, and nothing here feeds `ci-run report` (that's the scan/image-scan+report
      # flow's own staged-output contract). Each step's own exit code is the real signal: a
      # failing check shows as that step failing, not a separate aggregated comment.
      - name: ci-run sast
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-scratch"
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$RUNNER_TEMP/ci-scratch:/scratch" \
            -e CI=true -e CI_SCRATCH_DIR=/scratch \
            korzacitools.azurecr.io/ci-common:0.3.0@sha256:aeb58c4af0405f1d564e608c0995c93d96a1f6cfb6513335922762ee5c0b97f9 \
            ci-run sast --repo-root "$PWD" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: ci-run iac-config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$RUNNER_TEMP/ci-scratch:/scratch" \
            -e CI=true -e CI_SCRATCH_DIR=/scratch \
            -e TRIVY_CACHE_DIR=/scratch/trivy-db \
            -e CI_IAC_CONFIG_BLOCKING=false \
            korzacitools.azurecr.io/ci-common:0.3.0@sha256:aeb58c4af0405f1d564e608c0995c93d96a1f6cfb6513335922762ee5c0b97f9 \
            ci-run iac-config --repo-root "$PWD" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: ci-run iac-dockerfile-lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$RUNNER_TEMP/ci-scratch:/scratch" \
            -e CI=true -e CI_SCRATCH_DIR=/scratch \
            -e CI_IAC_DOCKERFILE_BLOCKING=false \
            korzacitools.azurecr.io/ci-common:0.3.0@sha256:aeb58c4af0405f1d564e608c0995c93d96a1f6cfb6513335922762ee5c0b97f9 \
            ci-run iac-dockerfile-lint --repo-root "$PWD" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
