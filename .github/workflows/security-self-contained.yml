name: Korza CI Base Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ci-common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Real license data in the published SBOM needs a real node_modules on disk - sca only
      # reads it, never installs anything itself. node_modules lands inside the checkout, so
      # it's already visible to the container below via the repo bind mount, no extra mount
      # needed.
      - uses: ./.github/actions/setup

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.CI_COMMON_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CI_COMMON_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CI_COMMON_AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name korzacitools

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ci-scratch/trivy-db
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-out" "$RUNNER_TEMP/ci-scratch"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$RUNNER_TEMP/ci-out:/out" \
            -e CI=true -e CI_SCRATCH_DIR=/scratch \
            -v "$RUNNER_TEMP/ci-scratch:/scratch" \
            -e TRIVY_CACHE_DIR=/scratch/trivy-db \
            -e CI_SCA_BLOCKING=true -e CI_IAC_CONFIG_BLOCKING=true -e CI_IAC_DOCKERFILE_BLOCKING=true \
            -e GITHUB_STEP_SUMMARY=/step-summary \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" \
            korzacitools.azurecr.io/ci-common:0.2.1-rc15@sha256:3287ace3a581569494d36a2e45d179e18d29f990c1a40e87346586fceadff7da \
            ci-run scan --out /out --repo-root /src --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: Report
        if: always()
        run: |
          docker run --rm \
            -v "$PWD/.git:/src/.git:ro" -w /src \
            -v "$RUNNER_TEMP/ci-out:/out" \
            -v "$GITHUB_EVENT_PATH:/event.json:ro" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_ACTIONS=true -e GITHUB_EVENT_NAME \
            -e GITHUB_EVENT_PATH=/event.json -e GITHUB_REPOSITORY \
            -e GITHUB_SHA -e GITHUB_API_URL -e GITHUB_SERVER_URL -e GITHUB_RUN_ID \
            korzacitools.azurecr.io/ci-common:0.2.1-rc15@sha256:3287ace3a581569494d36a2e45d179e18d29f990c1a40e87346586fceadff7da \
            ci-run report --in /out --event-file /event.json --repo-root /src

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sca-sbom
          path: |
            ${{ runner.temp }}/ci-scratch/ci-common/sca.sbom.cdx.json
            ${{ runner.temp }}/ci-scratch/ci-common/sca.sbom.spdx.json
          if-no-files-found: warn
