name: security (unified v4, comparison)

on:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: korzainc/shared-workflows/.github/workflows/ci.yml@v4
    with:
      sca_blocking: true
      iac_config_blocking: true
      iac_dockerfile_blocking: true
      common_azure_client_id: ${{ vars.CI_COMMON_AZURE_CLIENT_ID }}
      common_azure_tenant_id: ${{ vars.CI_COMMON_AZURE_TENANT_ID }}
      common_azure_subscription_id: ${{ vars.CI_COMMON_AZURE_SUBSCRIPTION_ID }}
    permissions:
      contents: read
      checks: write
      id-token: write

  security-comment:
    needs: security
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    uses: korzainc/shared-workflows/.github/workflows/security-pr-report.yml@v2
    permissions:
      contents: read
      pull-requests: write
